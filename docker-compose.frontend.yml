services:
  web:
    build:
      context: ./app
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
        GOOGLE_SERVER_CLIENT_ID: ${GOOGLE_SERVER_CLIENT_ID:?Set GOOGLE_SERVER_CLIENT_ID before building the frontend}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
